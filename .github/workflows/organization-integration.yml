name: Organization integration

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: Deploy preview URL to test
        required: true
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    environment: organization-integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Run organization integration flow
        env:
          TUBETALLY_E2E_URL: ${{ inputs.target_url }}
          TUBETALLY_E2E_ADMIN_EMAIL: ${{ secrets.TUBETALLY_E2E_ADMIN_EMAIL }}
          TUBETALLY_E2E_ADMIN_PASSWORD: ${{ secrets.TUBETALLY_E2E_ADMIN_PASSWORD }}
          TUBETALLY_E2E_MEMBER_EMAIL: ${{ secrets.TUBETALLY_E2E_MEMBER_EMAIL }}
          TUBETALLY_E2E_MEMBER_PASSWORD: ${{ secrets.TUBETALLY_E2E_MEMBER_PASSWORD }}
        run: node tools/test-organizations-integration.mjs
